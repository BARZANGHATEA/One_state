name: OneState daily

on:
  # Started by the Telegram bot (/run, /debug) and by the daily Vercel cron.
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug mode: screenshots of every step (true/false)"
        required: false
        default: "false"
        type: string
      account:
        description: "Only this account (empty = all)"
        required: false
        default: ""
        type: string
  # Backup run later in the day, in case the Vercel cron did not fire. Safe to run twice.
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: read

concurrency:
  group: onestate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No marketplace actions are used, so repository "Actions permissions" settings cannot block this workflow.
      - name: Get code
        run: |
          git init -q .
          git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          node -v
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright-core install --with-deps chromium
      - name: Run
        run: node automation/run.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          STORE_CHAT_ID: ${{ secrets.STORE_CHAT_ID }}
          EVENT_SLUG: ${{ vars.EVENT_SLUG || 'halloween' }}
          ITEM_NAME: ${{ vars.ITEM_NAME || '1' }}
          DEBUG: ${{ inputs.debug || 'false' }}
          ACCOUNT: ${{ inputs.account || '' }}
